<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MatGPT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sidebar:    #1E2235;
      --sidebar-hi: #272D45;
      --bg:         #F7F8FC;
      --panel:      #FFFFFF;
      --accent:     #4361EE;
      --accent-dim: #EEF1FD;
      --text:       #1C1E2A;
      --muted:      #8B8FA8;
      --border:     #E4E7F0;
      --radius:     12px;
    }

    html, body { height: 100%; font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); }

    /* ── Layout ─────────────────────────────────────────────── */
    .app { display: flex; height: 100vh; overflow: hidden; }

    /* ── Sidebar ─────────────────────────────────────────────── */
    .sidebar {
      width: 240px; flex-shrink: 0;
      background: var(--sidebar);
      display: flex; flex-direction: column;
      padding: 28px 16px 20px;
      gap: 0;
    }

    /* Avatar card */
    .avatar-wrap {
      display: flex; flex-direction: column; align-items: center;
      gap: 14px; padding-bottom: 24px;
      animation: avatarIn .5s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes avatarIn {
      from { opacity: 0; transform: scale(.93) translateY(8px); }
      to   { opacity: 1; transform: none; }
    }

    .avatar-face {
      width: 120px; height: 120px;
      border-radius: 50%;
      background: var(--sidebar-hi);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 32px rgba(0,0,0,.35);
      overflow: hidden;
    }
    .avatar-face svg { width: 100%; height: 100%; }

    .avatar-name {
      color: #FFFFFF;
      font-size: 18px; font-weight: 600;
      letter-spacing: -.01em;
    }

    .model-tag {
      background: rgba(255,255,255,.08);
      color: var(--muted);
      font-size: 11px; font-weight: 500;
      padding: 4px 10px; border-radius: 20px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 100%;
    }

    .token-info {
      color: var(--muted);
      font-size: 11px; line-height: 1.6;
      text-align: center;
    }
    .token-info span { color: rgba(255,255,255,.55); font-weight: 500; }

    /* Divider */
    .sidebar-divider {
      height: 1px; background: rgba(255,255,255,.07);
      margin: 20px 0 16px;
    }

    /* New chat */
    .btn-new {
      display: block; width: 100%;
      padding: 9px 14px;
      background: var(--accent);
      color: #fff; font-size: 13px; font-weight: 500;
      border: none; border-radius: 8px;
      cursor: pointer; text-align: center;
      transition: background .15s;
      margin-bottom: 16px;
    }
    .btn-new:hover { background: #3451d1; }

    /* History list */
    .history-label {
      font-size: 10px; font-weight: 600;
      color: rgba(255,255,255,.25);
      letter-spacing: .06em;
      text-transform: none;
      padding: 0 4px; margin-bottom: 6px;
    }
    .history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    .history::-webkit-scrollbar { width: 4px; }
    .history::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 4px; }
    .history-item {
      padding: 8px 10px;
      border-radius: 7px;
      color: rgba(255,255,255,.55);
      font-size: 12px; font-weight: 400;
      cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: background .12s, color .12s;
    }
    .history-item:hover { background: rgba(255,255,255,.06); color: rgba(255,255,255,.85); }
    .history-item.active { background: rgba(67,97,238,.25); color: #fff; }

    /* ── Main chat area ──────────────────────────────────────── */
    .chat-area {
      flex: 1; display: flex; flex-direction: column;
      min-width: 0;
    }

    /* Top bar */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    .topbar-title {
      font-size: 15px; font-weight: 600;
      color: var(--text);
    }
    .model-select {
      font-family: inherit; font-size: 12px; font-weight: 500;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px; padding: 5px 10px;
      cursor: pointer; outline: none;
      transition: border-color .15s;
    }
    .model-select:focus { border-color: var(--accent); }

    /* Messages */
    .messages {
      flex: 1; overflow-y: auto;
      padding: 28px 32px;
      display: flex; flex-direction: column; gap: 20px;
    }
    .messages::-webkit-scrollbar { width: 5px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg { display: flex; gap: 12px; max-width: 76%; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.assistant { align-self: flex-start; }

    .msg-avatar {
      width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600;
    }
    .msg.assistant .msg-avatar { background: var(--accent-dim); color: var(--accent); }
    .msg.user .msg-avatar { background: var(--accent); color: #fff; }

    .msg-bubble {
      padding: 11px 15px;
      border-radius: 14px;
      font-size: 14px; line-height: 1.55;
    }
    .msg.assistant .msg-bubble {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px 14px 14px 14px;
      color: var(--text);
    }
    .msg.user .msg-bubble {
      background: var(--accent);
      border-radius: 14px 4px 14px 14px;
      color: #fff;
    }

    /* Typing indicator */
    .typing { display: flex; align-items: center; gap: 4px; padding: 14px 16px; }
    .typing-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted);
      animation: blink 1.2s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: .2s; }
    .typing-dot:nth-child(3) { animation-delay: .4s; }
    @keyframes blink {
      0%,80%,100% { opacity: .25; transform: scale(1); }
      40% { opacity: 1; transform: scale(1.15); }
    }

    /* Input bar */
    .input-bar {
      padding: 16px 32px 20px;
      border-top: 1px solid var(--border);
      background: var(--panel);
    }
    .input-wrap {
      display: flex; align-items: flex-end; gap: 10px;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      transition: border-color .15s;
    }
    .input-wrap:focus-within { border-color: var(--accent); }

    #msg-input {
      flex: 1; font-family: inherit; font-size: 14px;
      background: none; border: none; outline: none;
      color: var(--text); resize: none;
      max-height: 120px; line-height: 1.5;
      min-height: 22px;
    }
    #msg-input::placeholder { color: var(--muted); }

    .btn-send {
      width: 34px; height: 34px; flex-shrink: 0;
      background: var(--accent); color: #fff;
      border: none; border-radius: 8px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background .15s, transform .1s;
    }
    .btn-send:hover { background: #3451d1; }
    .btn-send:active { transform: scale(.94); }
    .btn-send svg { width: 16px; height: 16px; }

    /* ── Empty state ─────────────────────────────────────────── */
    .empty-state {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px; color: var(--muted);
    }
    .empty-state strong { font-size: 16px; font-weight: 600; color: var(--text); }
    .empty-state p { font-size: 13px; }

    /* ── Reduced motion ──────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      .avatar-wrap, .typing-dot { animation: none; }
    }

    /* ── Responsive ──────────────────────────────────────────── */
    @media (max-width: 640px) {
      .sidebar { width: 200px; }
      .messages { padding: 20px 16px; }
      .input-bar { padding: 12px 16px 16px; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="avatar-wrap">
      <div class="avatar-face">
        <!-- Cartoon avatar SVG: sided hair, thick black glasses -->
        <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <!-- Neck -->
          <rect x="48" y="92" width="24" height="18" rx="4" fill="#D4956A"/>
          <!-- Shirt collar -->
          <path d="M35 108 Q60 100 85 108 L90 120 L30 120Z" fill="#3451D1"/>
          <path d="M60 104 L52 120 L68 120Z" fill="#2A40A8"/>
          <!-- Face -->
          <ellipse cx="60" cy="62" rx="34" ry="36" fill="#E8A87C"/>
          <!-- Hair — side swept right -->
          <path d="M26 52 Q28 22 60 20 Q82 18 90 30 Q96 40 92 50
                   Q88 44 78 40 Q68 36 60 36 Q44 36 36 44 Q30 50 26 52Z"
                fill="#1A0F0A"/>
          <!-- Side sweep over forehead, going right -->
          <path d="M26 52 Q30 38 42 34 Q54 30 68 34 Q80 38 86 48
                   Q80 42 68 40 Q54 38 44 42 Q34 46 30 54Z"
                fill="#1A0F0A"/>
          <!-- Left ear -->
          <ellipse cx="27" cy="64" rx="6" ry="8" fill="#D4956A"/>
          <ellipse cx="27.5" cy="64" rx="3.5" ry="5.5" fill="#C07F58"/>
          <!-- Right ear -->
          <ellipse cx="93" cy="64" rx="6" ry="8" fill="#D4956A"/>
          <ellipse cx="92.5" cy="64" rx="3.5" ry="5.5" fill="#C07F58"/>
          <!-- Eyes (behind glasses) -->
          <ellipse cx="47" cy="62" rx="6" ry="5" fill="#fff"/>
          <ellipse cx="73" cy="62" rx="6" ry="5" fill="#fff"/>
          <circle cx="47" cy="63" r="3.2" fill="#2A1A0E"/>
          <circle cx="73" cy="63" r="3.2" fill="#2A1A0E"/>
          <circle cx="48.2" cy="61.8" r="1" fill="#fff" opacity=".7"/>
          <circle cx="74.2" cy="61.8" r="1" fill="#fff" opacity=".7"/>
          <!-- Thick glasses frames -->
          <!-- Left lens -->
          <rect x="37" y="54" width="22" height="16" rx="5" fill="none" stroke="#111" stroke-width="3.5"/>
          <!-- Right lens -->
          <rect x="61" y="54" width="22" height="16" rx="5" fill="none" stroke="#111" stroke-width="3.5"/>
          <!-- Bridge -->
          <line x1="59" y1="62" x2="61" y2="62" stroke="#111" stroke-width="3"/>
          <!-- Left temple arm -->
          <line x1="37" y1="62" x2="31" y2="63" stroke="#111" stroke-width="3" stroke-linecap="round"/>
          <!-- Right temple arm -->
          <line x1="83" y1="62" x2="89" y2="63" stroke="#111" stroke-width="3" stroke-linecap="round"/>
          <!-- Nose -->
          <path d="M60 68 Q56 74 58 76 Q60 77 62 76 Q64 74 60 68Z" fill="#C07F58"/>
          <!-- Smile -->
          <path d="M50 84 Q60 91 70 84" stroke="#8B5E3C" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="avatar-name">Mat</div>
      <div class="model-tag" id="sidebar-model">Loading model…</div>
      <div class="token-info" id="token-info">
        <span>—</span> tokens this session
      </div>
    </div>

    <div class="sidebar-divider"></div>

    <button class="btn-new" onclick="newChat()">New chat</button>

    <div class="history-label">Recent</div>
    <div class="history" id="history-list">
      <!-- populated dynamically -->
    </div>
  </aside>

  <!-- ── Chat area ── -->
  <main class="chat-area">
    <div class="topbar">
      <span class="topbar-title" id="chat-title">MatGPT</span>
      <select class="model-select" id="model-select" onchange="switchModel(this.value)">
        <option value="">Loading…</option>
      </select>
    </div>

    <div class="messages" id="messages">
      <div class="empty-state" id="empty-state">
        <strong>Ask Mat anything.</strong>
        <p>Powered by your local models via LM Studio.</p>
      </div>
    </div>

    <div class="input-bar">
      <div class="input-wrap">
        <textarea id="msg-input" rows="1" placeholder="Type a message…"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"></textarea>
        <button class="btn-send" onclick="sendMessage()" title="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>
  </main>
</div>

<script>
  // ── State ───────────────────────────────────────────────────
  const BASE = 'http://localhost:8000';
  let currentConvId = null;
  let currentModel  = null;
  let totalTokens   = 0;

  // ── Boot ────────────────────────────────────────────────────
  async function boot() {
    try {
      const res  = await fetch(`${BASE}/models`);
      const data = await res.json();
      const models = data.models || [];

      const sel = document.getElementById('model-select');
      sel.innerHTML = models.map(m =>
        `<option value="${m}">${m}</option>`
      ).join('');

      if (models.length) {
        currentModel = models[0];
        await fetch(`${BASE}/models/select`, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({model: currentModel})
        });
        document.getElementById('sidebar-model').textContent = currentModel;
      }

      loadHistory();
    } catch {
      document.getElementById('sidebar-model').textContent = 'offline';
      document.getElementById('model-select').innerHTML = '<option>— no server —</option>';
      // Show demo messages when backend is offline
      demoMode();
    }
  }

  function demoMode() {
    appendMsg('assistant', "Hi! I'm Mat — your local AI assistant. Start the backend server to chat for real. For now, I'm just showing you how I look.");
    document.getElementById('sidebar-model').textContent = 'demo mode';
  }

  // ── Chat ────────────────────────────────────────────────────
  async function sendMessage() {
    const input = document.getElementById('msg-input');
    const text  = input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = '';
    hideEmpty();

    appendMsg('user', text);
    const typingEl = showTyping();

    try {
      // Create conv on first message
      if (!currentConvId) {
        const r = await fetch(`${BASE}/conversations`, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({name: text.slice(0, 40), system_prompt: 'You are a helpful, concise assistant.'})
        });
        const d = await r.json();
        currentConvId = d.id;
        document.getElementById('chat-title').textContent = d.name;
        loadHistory();
      }

      const res = await fetch(`${BASE}/conversations/${currentConvId}/chat`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({message: text})
      });

      const data = await res.json();
      typingEl.remove();
      appendMsg('assistant', data.response);

      totalTokens += data.tokens?.total || 0;
      document.getElementById('token-info').innerHTML =
        `<span>${totalTokens.toLocaleString()}</span> tokens this session`;

    } catch {
      typingEl.remove();
      appendMsg('assistant', 'Backend not reachable. Run `python -m matgpt.server` first.');
    }
  }

  function appendMsg(role, text) {
    const messages = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = `msg ${role}`;

    const initial = role === 'assistant' ? 'M' : 'Y';
    div.innerHTML = `
      <div class="msg-avatar">${initial}</div>
      <div class="msg-bubble">${escHtml(text)}</div>
    `;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function showTyping() {
    const messages = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg assistant';
    div.innerHTML = `
      <div class="msg-avatar">M</div>
      <div class="msg-bubble">
        <div class="typing">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>
    `;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  function hideEmpty() {
    const e = document.getElementById('empty-state');
    if (e) e.remove();
  }

  // ── Model ───────────────────────────────────────────────────
  async function switchModel(model) {
    currentModel = model;
    document.getElementById('sidebar-model').textContent = model;
    try {
      await fetch(`${BASE}/models/select`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({model})
      });
    } catch {}
  }

  // ── History ─────────────────────────────────────────────────
  async function loadHistory() {
    try {
      const res  = await fetch(`${BASE}/conversations`);
      const data = await res.json();
      const list = document.getElementById('history-list');
      list.innerHTML = (data.conversations || []).map(c => `
        <div class="history-item ${c.id === currentConvId ? 'active' : ''}"
             onclick="loadConv('${c.id}', ${JSON.stringify(c.name)})">
          ${escHtml(c.name)}
        </div>
      `).join('');
    } catch {}
  }

  async function loadConv(id, name) {
    currentConvId = id;
    document.getElementById('chat-title').textContent = name;
    const messages = document.getElementById('messages');
    messages.innerHTML = '';
    totalTokens = 0;

    try {
      const res  = await fetch(`${BASE}/conversations/${id}`);
      const data = await res.json();
      (data.messages || []).forEach(m => {
        if (m.role !== 'system') appendMsg(m.role, m.content);
        totalTokens += m.token_count || 0;
      });
      document.getElementById('token-info').innerHTML =
        `<span>${totalTokens.toLocaleString()}</span> tokens this session`;
    } catch {}

    loadHistory();
  }

  function newChat() {
    currentConvId = null;
    totalTokens   = 0;
    document.getElementById('chat-title').textContent = 'MatGPT';
    document.getElementById('token-info').innerHTML = '<span>—</span> tokens this session';
    const messages = document.getElementById('messages');
    messages.innerHTML = `
      <div class="empty-state" id="empty-state">
        <strong>Ask Mat anything.</strong>
        <p>Powered by your local models via LM Studio.</p>
      </div>
    `;
    loadHistory();
  }

  // ── Helpers ─────────────────────────────────────────────────
  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/\n/g,'<br>');
  }

  boot();
</script>
</body>
</html>
